    .heart { fill: #f6b39a; }
    .words { font: italic 22px 'Snell Roundhand', 'Segoe Script', 'Apple Chancery', 'Brush Script MT', cursive; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #a9d3bf; }
      .stem { stroke: #a9d3bf; }
    }
  </style>
  <defs>
